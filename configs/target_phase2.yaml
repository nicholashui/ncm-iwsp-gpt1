# Phase-2 NCM-iWSP-GPT1 target. Same 12/768/12 body as configs/target.yaml.
# CI estimates this file; it does not need to instantiate it.
#
# prefix_len 32 is the smaller of the two plan candidates (32 or 64).
# Sequence length is 32 + 4306 = 4338. prefix_len 64 would be 4370 and is
# shape-checked on the small model, not selected here. Switch by editing
# prefix_len. Mask and RoPE buffers are rebuilt from that length; wte, blocks,
# and lm_heads keep the phase-1 shapes.
#
# prefix_source window uses the first prefix_len tokens of the window at
# train time and the prompt at chat time. A short prompt is right-padded with
# pad id 50257. predict_level0 stays false. This file does not start training
# and does not replace configs/target.yaml.
name: NCM-iWSP-GPT1-phase2
seed: 0
heavy: true

pretok:
  kind: gpt2
  pad_vocab_to: 50304

tokenizer:
  embed_dim: 384
  context_length: 512
  n_heads: 6          # official configs call this n_layers; it is the head count
  dropout: 0.0
  enc_layers: 0
  dec_layers: 1
  use_qk_norm: true
  pre_quant_groupnorm: 8
  codebook_size: 4096
  # 1^2 .. 22^2, then 512 instead of 23^2. 23 levels, 4307 grid cells.
  levels: [1, 4, 9, 16, 25, 36, 49, 64, 81, 100, 121, 144, 169, 196, 225, 256, 289, 324, 361, 400, 441, 484, 512]
  learned_l1_sampling: true
  learned_l1_cascade: true
  learned_l1_cascade_base: 4
  quant_resi:
    enabled: true
    ratio: 0.5

generator:
  n_layer: 12
  n_head: 12
  n_embd: 768
  bias: true
  dropout: 0.0
  prefix_len: 32
  prefix_source: window
  rope_base: 100000
  use_rope: true
  use_level_encoding: true
  use_qk_norm: true
  attn_pattern: block_diagonal
  predict_level0: false

data:
  dataset: lucadiliello/bookcorpusopen
  hidden_pct: 1
  visible_pct: 1
  max_windows: 0

eval:
  batch_size: 1
  max_windows: 2
  n_generate: 0
  device: auto
